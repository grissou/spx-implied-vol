[project]
name = "spxvol"
version = "0.1.0"
description = "Implied vol surface and risk-neutral density from a live option chain"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "pyarrow", "yfinance"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

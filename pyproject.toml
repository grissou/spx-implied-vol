[project]
name = "spxvol"
version = "0.1.0"
description = "SPX implied vol surface, risk-neutral density and local vol Monte Carlo from OptionMetrics data"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "pyarrow", "wrds"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
